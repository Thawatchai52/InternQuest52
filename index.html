<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intern Quest Guild</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Itim&family=Press+Start+2P&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-is@18.3.1/umd/react-is.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fdf6e3;--card:#fff;--ink:#2b2140;--line:#2b2140}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1530;--card:#2a2147;--ink:#f3ecff;--line:#a78bfa}}
body{background:var(--bg);color:var(--ink);font-family:'Prompt','Noto Sans Thai',system-ui,sans-serif;min-height:100vh}
.px{background:var(--card);border:3px solid var(--line);border-radius:14px;box-shadow:4px 4px 0 var(--line)}
.btn{border:3px solid var(--line);border-radius:10px;padding:.35rem .8rem;font-weight:700;box-shadow:2px 2px 0 var(--line);transition:transform .1s}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
@keyframes pop{0%{transform:translateY(20px) scale(.5);opacity:0}30%{transform:translateY(0) scale(1.15);opacity:1}100%{transform:translateY(-60px) scale(1);opacity:0}}
.pop{animation:pop 2.2s ease-out forwards}
@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bounce{animation:bnc .8s infinite}
:root,:root:not([data-theme="light"]){--bg:#3b2414;--card:#f3e2b8;--ink:#3b2412;--line:#2a170a}
body{background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.55)),repeating-linear-gradient(90deg,#5a3a1f 0 46px,#4b2f18 46px 48px);background-attachment:fixed;color:#f6e7c1;font-family:'Itim','Noto Sans Thai',system-ui,sans-serif}
.px{background:linear-gradient(#f6e7c1,#ecd49b);color:#3b2412;border:4px solid #5a3a1e;border-radius:6px;box-shadow:inset 0 0 0 2px #d9a441,4px 4px 0 #1f1008}
.px.p-8{background:repeating-linear-gradient(0deg,#7a4e28 0 10px,#6b4423 10px 12px);color:#f6e7c1;border-color:#d9a441}
.btn{border:3px solid #2a170a;border-radius:6px;margin-bottom:3px;font-family:inherit;box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(0,0,0,.28),0 3px 0 #2a170a}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.28),0 0 0 #2a170a}
.ptitle{font-family:'Press Start 2P',monospace}
.banner{display:inline-block;padding:10px 28px;background:linear-gradient(#4a7fb8,#2f5f94);border:5px solid #d9a441;border-radius:6px;box-shadow:0 0 0 3px #2a170a,6px 6px 0 #1f1008;text-align:center}
.banner .ptitle{color:#ffd96a;font-size:clamp(14px,4.5vw,28px);text-shadow:3px 3px 0 #2a170a}
.guild{color:#fff3cf;font-weight:700;margin-top:4px;text-shadow:2px 2px 0 #2a170a}
.board{background:repeating-linear-gradient(90deg,#8a5a2e 0 38px,#7a4e26 38px 40px);border:8px solid #5a3a1e;border-radius:8px;padding:16px;box-shadow:inset 0 0 0 3px #d9a441,6px 6px 0 #1f1008}
.plaque{background:linear-gradient(#a8742f,#8a5a2e);color:#fff3cf;border:4px solid #d9a441;font-size:1.4rem;font-weight:700;padding:4px 16px;border-radius:6px;text-shadow:2px 2px 0 #2a170a;box-shadow:4px 4px 0 #1f1008}
.space-y-1>div{background:#3a2515;color:#f6e7c1;border-color:#d9a441!important;border-radius:4px}
.portrait{background:radial-gradient(#fff3cf,#ecd49b);border:3px solid #5a3a1e;padding:4px;border-radius:4px}
.slot{width:30px;height:30px;border:3px solid #5a3a1e;background:#8a6034;box-shadow:inset 2px 2px 0 #6b4423,inset -2px -2px 0 #a97c46;display:flex;align-items:center;justify-content:center;font-size:16px}
.slot-on{background:#e8c878;border-color:#c99a2e}.slot-red{background:#d6453d;border-color:#7a1410}
@keyframes glow{from{box-shadow:inset 0 0 0 2px #ff6a3d,0 0 6px #ff3d1f}to{box-shadow:inset 0 0 0 2px #ff6a3d,0 0 22px #ff3d1f}}
.fullq{border-color:#b3261e;animation:glow .8s infinite alternate}
@keyframes idle{50%{transform:translateY(-2px)}}.idle{animation:idle 1.2s steps(2) infinite}
@keyframes flick{to{transform:translateY(-4px) scale(1.2)}}.flame{animation:flick .35s infinite alternate;transform-box:fill-box;transform-origin:center bottom}
@keyframes beat{50%{transform:scale(1.35)}}.heart{animation:beat .8s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blk{50%{opacity:.35}}.blink{animation:blk 1s steps(2) infinite}
@keyframes shk{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}.shake{animation:shk .45s}
.fixed.inset-0>.px{max-height:92vh;overflow-y:auto}
@keyframes hopk{50%{transform:translateY(-5px)}}
.walking .idle{animation:hopk .25s infinite}
.hopT{animation:hopk .25s infinite;transform-box:fill-box}
@keyframes pingk{from{transform:scale(.3);opacity:1}to{transform:scale(1.8);opacity:0}}
.ping{animation:pingk .8s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes capk{0%{transform:translateY(-40px) scale(.5);opacity:0}35%{transform:translateY(40px);opacity:1}55%{transform:translateY(15px)}75%{transform:translateY(40px)}100%{transform:translateY(34px);opacity:1}}
.capsule{animation:capk 1.5s ease-out forwards}
@keyframes burstk{from{transform:scale(.2);opacity:1}to{transform:scale(2.4);opacity:0}}
.burst{animation:burstk .9s ease-out forwards}
.flick{animation:flk 1.3s infinite alternate}
@keyframes flk{from{opacity:.65}to{opacity:1}}
.goldtag{display:inline-block;background:linear-gradient(90deg,#ffe27a,#e8b92c);color:#5a3a00;border:2px solid #b8860b;border-radius:4px;font-size:11px;font-weight:700;padding:0 6px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

/* ===== ตั้งค่ารายชื่อ (แก้ได้ตรงนี้) ===== */
const SENIORS = ["พี่เอก", "พี่มายด์", "พี่บอส", "พี่เนย", "พี่เจ"];
const INTERNS = ["น้องภูมิ", "น้องฟ้า", "น้องมิน", "น้องกัส"];

const ITEMS = [
  {id:"h1",cat:"hat",name:"มงกุฎ",e:"👑",price:100},{id:"h2",cat:"hat",name:"หมวกแก๊ป",e:"🧢",price:60},
  {id:"h3",cat:"hat",name:"หมวกทรงสูง",e:"🎩",price:80},{id:"h4",cat:"hat",name:"โบว์",e:"🎀",price:50},
  {id:"g1",cat:"glasses",name:"แว่นกันแดด",e:"🕶️",price:60},{id:"g2",cat:"glasses",name:"แว่นตา",e:"👓",price:40},
  {id:"g3",cat:"glasses",name:"แว่นหัวใจ",e:"😍",price:70},
  {id:"o0",cat:"outfit",name:"ชุดเทา",c:"#94a3b8",price:0},{id:"o1",cat:"outfit",name:"ชุดฮีโร่",c:"#ef4444",e:"⚡",price:80},
  {id:"o2",cat:"outfit",name:"ชุดจอมเวท",c:"#8b5cf6",e:"✨",price:100},{id:"o3",cat:"outfit",name:"ชุดทะเล",c:"#0ea5e9",e:"🌊",price:60},
  {id:"p1",cat:"pet",name:"แมว",e:"🐱",price:90},{id:"p2",cat:"pet",name:"หมา",e:"🐶",price:90},
  {id:"p3",cat:"pet",name:"ลูกเจี๊ยบ",e:"🐥",price:60},{id:"p4",cat:"pet",name:"มังกร",e:"🐉",price:150},
  {id:"f1",cat:"frame",name:"กรอบชมพู",c:"#f472b6",price:50},{id:"f2",cat:"frame",name:"กรอบทอง",c:"#fbbf24",price:70},
  {id:"f3",cat:"frame",name:"กรอบรุ้ง",c:"rainbow",price:120},
];
const CATS = {hat:"🎩 หมวก/ทรงผม",glasses:"🕶️ แว่น/เครื่องประดับ",outfit:"👕 ชุด",pet:"🐾 สัตว์เลี้ยง",frame:"🖼️ กรอบโปรไฟล์"};
const item = id => ITEMS.find(i => i.id === id);
ITEMS.push(
  {id:"x1",cat:"pet",name:"สัตว์เลี้ยงมินเนี่ยนจิ๋ว",rare:true,tier:"SSR"},
  {id:"x2",cat:"aura",name:"ออร่าสายฟ้าสีเหลืองทอง",rare:true,tier:"SSR"},
  {id:"x3",cat:"outfit",name:"ชุดเอี๊ยมยีนส์มินเนี่ยน",c:"#3a6db3",rare:true,tier:"SR"},
  {id:"x4",cat:"weapon",name:"ดาบกล้วยทองคำเรืองแสง",rare:true,tier:"SR"},
  {id:"x5",cat:"glasses",name:"แว่นตากลมมินเนี่ยน 2 ตา",e:"🥽",rare:true,tier:"R"},
  {id:"x6",cat:"hat",name:"หมวกกล้วยหอม",e:"🍌",rare:true,tier:"R"},
  {id:"x7",cat:"hat",name:"มงกุฎราชาบ็อบ",e:"👑",rare:true,tier:"R"}
);
const KEY = "intern-quest-v1";
const SKILLS = {"น้องภูมิ":["สายกราฟิก","สายคอนเทนต์"],"น้องฟ้า":["สายตัดต่อ"],"น้องมิน":["สายคอนเทนต์"],"น้องกัส":["สายกราฟิก","สายตัดต่อ"]};
const STATUS = {ready:{e:"🟢",t:"พร้อมลุย"},break:{e:"🟡",t:"พักเที่ยง/ติดประชุม"},leave:{e:"🔴",t:"ลางาน"}};
const OPEN_BONUS = 30;
const GUILD_PASS = "202328";
const dueOf = f => f.dueSel==="ระบุเอง" ? (f.dueCustom.trim()||"ระบุภายหลัง") : f.dueSel;
const SND = {on:true,ctx:null};
try{ SND.on = localStorage.getItem("iq-snd")!=="0"; }catch(e){}
const sfx = name => { if(!SND.on) return; try{
  const C = window.AudioContext||window.webkitAudioContext; SND.ctx = SND.ctx||new C(); const a = SND.ctx; if(a.state==="suspended") a.resume();
  const seqs = {click:[[660,.05]],quest:[[523,.08],[659,.08],[784,.16]],coin:[[988,.07],[1319,.25]],nope:[[200,.15],[140,.22]],gacha:[[262,.08],[330,.08],[392,.08],[523,.08],[392,.08],[523,.08],[659,.08],[784,.3]],ssr:[[784,.1],[988,.1],[1319,.1],[1568,.1],[1976,.45]]};
  let t = a.currentTime;
  (seqs[name]||[]).forEach(([fr,d])=>{const o=a.createOscillator(),g=a.createGain(); o.type="square"; o.frequency.value=fr; g.gain.setValueAtTime(.08,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d); t+=d*.9;});
}catch(e){} };
document.addEventListener("click",e=>{ if(e.target.closest && e.target.closest("button")) sfx("click"); });
function SoundBtn() {
  const [on,setOn] = useState(SND.on);
  return <button className="btn bg-amber-300 text-black" style={{position:"fixed",top:"calc(env(safe-area-inset-top,0px) + 8px)",right:8,zIndex:60}} title="เสียง" onClick={()=>{SND.on=!SND.on; setOn(SND.on); try{localStorage.setItem("iq-snd",SND.on?"1":"0");}catch(e){}}}>{on?"🔊":"🔇"}</button>;
}
Object.assign(SKILLS,{"น้องภูมิ":["สายดาต้า"],"น้องฟ้า":["สายกราฟิก"],"น้องมิน":["สายตัดต่อ"],"น้องกัส":["สายคอนเทนต์"]});
const norm = d => { d.roster = d.roster||Object.keys(d.interns); INTERNS.splice(0,INTERNS.length,...d.roster); d.acts = d.acts||[]; d.visits = d.visits||0; if(!d.cal) d.cal={events:[{id:1,date:"2026-11-02",title:"ประชุมทีมเช้า",repeat:"weekly",color:"#cfe8ff",note:""},{id:2,date:"2026-11-15",title:"ส่งแผนคอนเทนต์เดือนถัดไป",repeat:"monthly",color:"#ffd9a8",note:""},{id:3,date:"2026-11-25",title:"ส่งรายงานสรุปงานประจำเดือน",repeat:"monthly",color:"#ffd0e0",note:""}],notes:{}}; d.cal.notes=d.cal.notes||{};
  if(!d.boss) d.boss={name:"บอสมังกรเดดไลน์",hp:500,max:500,hitT:0,dmg:0,kills:0}; { const wk=Math.floor(Date.now()/6048e5); if(d.boss.week!==wk){ d.boss.week=wk; d.boss.hp=d.boss.max; } } d.open = d.open || [
  {id:901,title:"ถ่ายรูปสินค้า 10 ภาพ",brief:"โฟลเดอร์สินค้า: https://example.com/products",by:"พี่เอก",urgent:false,status:"todo",coins:50+OPEN_BONUS},
  {id:902,title:"ทำสไลด์สรุปประชุมด่วน",brief:"สรุป 5 หน้า ส่งก่อนเย็น",by:"พี่บอส",urgent:true,status:"todo",coins:100+OPEN_BONUS}];
  INTERNS.forEach(n=>{const m=d.interns[n]; if(!m) return; if(m.exp==null) m.exp=(m.done||0)*40; if(m.cls) CLS[n]=m.cls; m.skills=SKILLS[n]||m.skills||[]; m.status=m.status||"ready"; m.log=m.log||[]; m.quests.forEach(x=>{if(!x.due) x.due=["วันนี้บ่าย","วันนี้เย็น","พรุ่งนี้"][x.id%3];});}); return d; };

const q = (id,title,brief,by,urgent,status="todo") => ({id,title,brief,by,urgent,status,coins:urgent?100:50});
const mkIntern = (coins,done,quests,owned=[],equip={}) => ({coins,done,quests,owned:["o0",...owned],equip:{outfit:"o0",...equip}});
const seed = () => ({interns:{
  "น้องภูมิ": mkIntern(120,4,[q(1,"ทำแบนเนอร์โปรโมชัน","ขนาด 1080x1080 ลิงก์ไฟล์: https://example.com/brief1","พี่เอก",false,"doing"),q(2,"สรุปรีเสิร์ชคู่แข่ง","ดูเพจคู่แข่ง 5 เจ้า สรุปเป็นสไลด์ 3 หน้า","พี่บอส",true)],["h2"],{hat:"h2"}),
  "น้องฟ้า": mkIntern(250,9,[q(3,"ตัดคลิป Reels","คลิปยาว 30 วิ ใส่ซับไทย","พี่มายด์",false,"doing"),q(4,"ตอบคอมเมนต์ลูกค้า","ใช้ทอนเสียงสุภาพ ตามไกด์ไลน์","พี่เนย",false),q(5,"จัดไฟล์ Drive","จัดโฟลเดอร์ใหม่ตามเดือน","พี่เจ",true)],["g1","o1","p1"],{glasses:"g1",outfit:"o1",pet:"p1"}),
  "น้องมิน": mkIntern(60,2,[]),
  "น้องกัส": mkIntern(300,6,[q(6,"เขียนแคปชันโพสต์","5 แคปชัน โทนสนุกๆ","พี่เจ",false)],["h1","f2"],{hat:"h1",frame:"f2"}),
}});

function AvatarOld({equip,size=110,uid}) {
  const o = item(equip.outfit||"o0"), f = equip.frame && item(equip.frame);
  const stroke = !f ? "#cbd5e1" : f.c==="rainbow" ? `url(#rb${uid})` : f.c;
  return (
    <svg width={size} height={size*1.1} viewBox="0 0 100 110">
      <defs><linearGradient id={`rb${uid}`}><stop offset="0" stopColor="#f43f5e"/><stop offset=".33" stopColor="#facc15"/><stop offset=".66" stopColor="#22c55e"/><stop offset="1" stopColor="#6366f1"/></linearGradient></defs>
      <circle cx="50" cy="55" r="47" fill="#e0f2fe" stroke={stroke} strokeWidth={f?6:3}/>
      <ellipse cx="50" cy="100" rx="28" ry="20" fill={o.c}/>
      {o.e && <text x="50" y="98" fontSize="14" textAnchor="middle">{o.e}</text>}
      <circle cx="50" cy="58" r="19" fill="#fcd9b6" stroke="#2b2140" strokeWidth="2"/>
      <circle cx="43" cy="58" r="2" fill="#2b2140"/><circle cx="57" cy="58" r="2" fill="#2b2140"/>
      <path d="M44 66q6 5 12 0" stroke="#2b2140" strokeWidth="2" fill="none"/>
      {equip.glasses && <text x="50" y="63" fontSize="24" textAnchor="middle">{item(equip.glasses).e}</text>}
      {equip.hat && <text x="50" y="44" fontSize="30" textAnchor="middle">{item(equip.hat).e}</text>}
      {equip.pet && <text x="82" y="100" fontSize="22" textAnchor="middle">{item(equip.pet).e}</text>}
    </svg>
  );
}

const CLS = {"น้องภูมิ":{k:"mage",skin:"#f5cfa0",hair:"#2f2118",body:"#5b4bb5"},"น้องฟ้า":{k:"bunny",skin:"#f8d5b0",hair:"#8a5a3a",body:"#4f8a3d"},"น้องมิน":{k:"rogue",skin:"#f2c9a0",hair:"#4a3020",body:"#5a4a32"},"น้องกัส":{k:"knight",skin:"#f5cfa0",hair:"#6b3a1e",body:"#9aa6b3"}};
Object.assign(CLS,{"พี่เอก":{k:"cleric",skin:"#f2c9a0",hair:"#2f2118",body:"#e8e4f0"},"พี่มายด์":{k:"mage",skin:"#f8d5b0",hair:"#d9577a",body:"#8a3fb5"},"พี่บอส":{k:"knight",skin:"#d9a47a",hair:"#2f2118",body:"#b5483a"},"พี่เนย":{k:"archer",skin:"#f8d5b0",hair:"#c98a3a",body:"#2f7d4a"},"พี่เจ":{k:"alchemist",skin:"#f2c9a0",hair:"#6b3a1e",body:"#a85a2a"}});
function Avatar({equip,size=110,uid,who,fx,bare,walk}) {
  const c = CLS[who]||CLS["น้องภูมิ"], k = c.k, ol = "#2a170a", sw = {stroke:ol,strokeWidth:2};
  const fr = equip.frame && item(equip.frame);
  const ring = !fr ? "#cdb98a" : fr.c==="rainbow" ? `url(#rb${uid})` : fr.c;
  const bc = equip.outfit && equip.outfit!=="o0" ? item(equip.outfit).c : c.body;
  const tired = fx==="full", H = !!equip.hat;
  return (
    <svg className={walk?"walking":""} width={size} height={size*1.1} viewBox="0 0 100 110" shapeRendering="crispEdges" style={{overflow:"visible"}}>
      <defs><linearGradient id={`rb${uid}`}><stop offset="0" stopColor="#f43f5e"/><stop offset=".33" stopColor="#facc15"/><stop offset=".66" stopColor="#22c55e"/><stop offset="1" stopColor="#6366f1"/></linearGradient></defs>
      {!bare && <circle cx="50" cy="56" r="47" fill="#fff3cf" stroke={ring} strokeWidth={fr?6:3}/>}
      {equip.aura && <g className="blink"><circle cx="50" cy="58" r="46" fill="rgba(255,215,0,.22)"/><polygon points="6,36 18,36 11,54 21,54 4,86 10,60 2,60" fill="#ffe14a"/><polygon points="94,36 82,36 89,54 79,54 96,86 90,60 98,60" fill="#ffe14a"/></g>}
      {equip.pet ? (equip.pet==="x1" ? <g transform="translate(66,54) scale(.28)"><g className="idle"><MinionBody/></g></g> : <text x="82" y="100" fontSize="22" textAnchor="middle">{item(equip.pet).e}</text>)
      : k==="mage" ? <g className="idle"><rect x="4" y="86" width="14" height="10" fill="#e0742e"/><rect x="2" y="80" width="9" height="8" fill="#e0742e"/><rect x="4" y="82" width="2" height="2" fill={ol}/><polygon points="10,86 16,76 20,86" fill="#b8431f"/></g>

function PassModal({onOk,onClose}) {
  const [code,setCode] = useState("");
  const [err,setErr] = useState(false);
  const [shake,setShake] = useState(false);
  const check = c => { if(c===GUILD_PASS){ onOk(); } else { setErr(true); setShake(true); sfx("nope"); if(window.__LOG) window.__LOG("security","ไม่ทราบ","มีการใส่รหัสฝั่งพี่ผิด"); setTimeout(()=>{setShake(false);setCode("");},450); } };
  const set = v => { v=v.replace(/\D/g,"").slice(0,6); setCode(v); setErr(false); if(v.length===6) check(v); };
  return (
    <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50" onClick={onClose}>
      <div className={`px p-5 w-full max-w-xs text-center ${shake?"shake":""}`} style={{background:"repeating-linear-gradient(90deg,#7a4e28 0 18px,#6b4423 18px 20px)",color:"#f6e7c1",borderColor:"#d9a441"}} onClick={e=>e.stopPropagation()}>
        <div className="text-5xl" style={{filter:"drop-shadow(0 0 8px #ffd96a)"}}>🔒</div>
        <div className="font-black text-lg mt-1" style={{color:"#ffd96a"}}>ประตูลับห้องหัวหน้ากิลด์</div>
        <div className="text-xs opacity-80">ใส่รหัสผ่าน 6 หลักเพื่อเข้าฝั่งพี่ในทีม</div>
        <input autoFocus type="password" inputMode="numeric" autoComplete="off" maxLength={6} value={code} onChange={e=>set(e.target.value)} className="w-full mt-3 text-center text-2xl border-4 rounded p-2 text-black" style={{letterSpacing:"0.4em",background:"#f6e7c1",borderColor:"#2a170a"}} placeholder="••••••"/>
        {err && <div className="text-sm font-black mt-2" style={{color:"#ff8a7a"}}>❌ รหัสเวทมนตร์ไม่ถูกต้อง! เฉพาะพี่ในทีมเท่านั้นนะ</div>}
        <div className="grid grid-cols-3 gap-2 mt-3">
          {[1,2,3,4,5,6,7,8,9].map(n=><button key={n} className="btn bg-stone-400 text-black text-xl" onClick={()=>set(code+n)}>{n}</button>)}
          <button className="btn bg-red-400 text-black" onClick={()=>set("")}>C</button>
          <button className="btn bg-stone-400 text-black text-xl" onClick={()=>set(code+"0")}>0</button>
          <button className="btn bg-amber-400 text-black" onClick={()=>set(code.slice(0,-1))}>⌫</button>
        </div>
        <button className="btn bg-white text-black text-sm mt-3" onClick={onClose}>ยกเลิก</button>
      </div>
    </div>
  );
}

const QR = {
  intern:["ขอเรฟเพิ่มหน่อยครับ 🙏","ตรงนี้ต้องทำไซส์ไหนนะครับ?","กำลังเร่งปั่นให้เลยครับ! 🔥"],
  senior:["ปรับแก้นิดนึงนะ","ยึดตามบรีฟล่าสุดในแชทนี้เลย","งานผ่านแล้ว กดส่งเควสได้เลย! 🎉"]};
const SEN_AV = ["🧑‍💼","👩‍💼","🧔","👩‍🎨","🧑‍💻"];
const unread = (x,role) => (x.chat||[]).filter(m=>(role==="senior"?m.role!=="senior":(m.role==="senior"||(x.party&&m.who!==x.owner))) && m.t>((x.seen||{})[role]||0)).length;
const linkify = t => t.split(/(https?:\/\/\S+)/g).map((p,i)=>/^https?:\/\//.test(p)?<a key={i} href={p} target="_blank" rel="noopener noreferrer" className="underline text-blue-600">{p}</a>:p);

function ChatBtn({x,role,onClick}) {
  const n = unread(x,role);
  return (<button className="btn bg-blue-500 text-white relative" onClick={onClick}>💬 แชทถามงาน{n>0&&<span className="bounce absolute -top-2 -right-2 min-w-[20px] h-5 px-1 rounded-full bg-red-500 text-white text-xs flex items-center justify-center border-2 border-[var(--line)]">{n}</span>}</button>);
}

function ChatModal({iname,qid,data,me,role,update,onClose}) {
  const x = data.interns[iname].quests.find(z=>z.id===qid);
  const [txt,setTxt] = useState("");
  const [clTxt,setClTxt] = useState("");
  const len = x ? (x.chat||[]).length : 0;
  useEffect(()=>{ update(s=>{const y=s.interns[iname].quests.find(z=>z.id===qid); if(y){y.seen=y.seen||{}; y.seen[role]=Date.now();}}); const el=document.getElementById("chatbox"); if(el) el.scrollTop=el.scrollHeight; },[len]);
  if(!x) return null;
  const send = t => { t=t.trim(); if(!t) return; update(s=>{const y=s.interns[iname].quests.find(z=>z.id===qid); if(!y) return; const now=Date.now(); copiesOf(s,y).forEach(c=>{c.chat=c.chat||[]; c.chat.push({who:me,role,text:t,t:now});}); y.seen=y.seen||{}; y.seen[role]=now;}); setTxt(""); };
  const setCl = fn => update(s=>{const y=s.interns[iname].quests.find(z=>z.id===qid); if(!y) return; copiesOf(s,y).forEach(c=>{c.cl=c.cl||[]; fn(c.cl);});});
  const addCl = () => { const t=clTxt.trim(); if(!t) return; const id=Date.now(); setCl(l=>{l.push({id,text:t,done:false});}); setClTxt(""); };
  const av = m => m.role==="intern" ? <Avatar equip={data.interns[m.who]?data.interns[m.who].equip:{}} uid={"c"+m.who} size={28} who={m.who}/> : <Avatar equip={{outfit:"o0"}} uid={"cs"+m.who} size={28} who={m.who}/>;
  return (
    <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-40" onClick={onClose}>
      <div className="px p-4 w-full max-w-md flex flex-col" style={{maxHeight:"85vh"}} onClick={e=>e.stopPropagation()}>
        <div className="flex justify-between items-center gap-2"><b>💬 {x.title}</b><button className="btn text-sm bg-white text-black" onClick={onClose}>✕</button></div>
        <div className="text-xs opacity-70">{iname} · สั่งโดย {x.by}</div>
        {x.party && <div className="mt-1"><PartyBadge x={x} data={data}/>
          <div className="mt-2 p-2 rounded border-2 border-dashed text-sm"><b>✅ เช็กลิสต์ร่วมตี้</b>
            {(x.cl||[]).map(it=><label key={it.id} className="flex items-center gap-2"><input type="checkbox" checked={!!it.done} onChange={()=>setCl(l=>{const i=l.find(z=>z.id===it.id); if(i) i.done=!i.done;})}/><span className={it.done?"line-through opacity-60":""}>{it.text}</span></label>)}
            <div className="flex gap-1 mt-1"><input className="flex-1 border-2 rounded p-1 text-black text-xs" placeholder="เพิ่มรายการ..." value={clTxt} onChange={e=>setClTxt(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") addCl();}}/><button className="btn bg-yellow-300 text-black text-xs" onClick={addCl}>+</button></div></div></div>}
        <div id="chatbox" className="flex-1 overflow-y-auto my-2 space-y-2" style={{minHeight:160}}>
          {len===0&&<div className="text-sm opacity-60 text-center mt-6">ยังไม่มีข้อความ เริ่มคุยได้เลย</div>}
          {(x.chat||[]).map((m,i)=>{const mine=m.who===me; return (
            <div key={i} className={`flex gap-2 items-end ${mine?"flex-row-reverse":""}`}>{av(m)}
              <div className={`rounded-xl border-2 border-[var(--line)] px-2 py-1 text-sm break-words text-black ${mine?"bg-green-200":"bg-white"}`} style={{maxWidth:"75%"}}>
                <div className="text-xs font-bold">{m.who} <span className="font-normal opacity-60">{new Date(m.t).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})}</span></div>
                {linkify(m.text)}
              </div>
            </div>);})}
        </div>
        <div className="flex flex-wrap gap-1 mb-2">{QR[role].map(t=><button key={t} className="btn text-xs bg-yellow-200 text-black" onClick={()=>send(t)}>{t}</button>)}</div>
        <div className="flex gap-2"><input className="flex-1 border-2 rounded p-2 text-black" placeholder="พิมพ์ข้อความ / แปะลิงก์..." value={txt} onChange={e=>setTxt(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") send(txt);}}/><button className="btn bg-green-400 text-black" onClick={()=>send(txt)}>ส่ง</button></div>
      </div>
    </div>
  );
}

let CUR = null;
const RC = window.Recharts;
const COLS = ["#c99a2e","#b3261e","#4f8a3d","#5b4bb5","#2f5f94"];
const ERRKEY = "iq-errs";
const logErr = m => { try{ const a=JSON.parse(localStorage.getItem(ERRKEY)||"[]"); a.unshift({t:Date.now(),msg:String(m).slice(0,200)}); localStorage.setItem(ERRKEY,JSON.stringify(a.slice(0,50))); }catch(e){} };

const pushAct = (s,type,who,text) => { s.acts=s.acts||[]; s.acts.push({t:Date.now(),type,who,text}); if(s.acts.length>300) s.acts=s.acts.slice(-300); };
const diffActs = (p,n) => {
  const a = CUR?CUR.name:"ระบบ", T = x=>"["+x.title+"]";
  INTERNS.forEach(nm=>{ const P=p.interns[nm], N=n.interns[nm]; if(!P||!N) return;
    N.quests.forEach(x=>{ const o=P.quests.find(z=>z.id===x.id);
      if(!o){ if((p.open||[]).some(z=>z.id===x.id)) pushAct(n,"take",nm,`${nm} รับเควสกลาง ${T(x)}`); else pushAct(n,"assign",a,`${a} มอบเควส ${T(x)} ให้${nm}`); }
      else {
        if(o.status!==x.status){ if(x.status==="review") pushAct(n,"submit",nm,`${nm} ส่งงาน ${T(x)} รอพี่ตรวจ`); else if(x.revise&&!o.revise) pushAct(n,"revise",a,`${a} ขอแก้งาน ${T(x)} ของ${nm}`); else if(x.status==="doing") pushAct(n,"work",nm,`${nm} เริ่มลุยไฟ ${T(x)}`); }
        if((x.chat||[]).length>(o.chat||[]).length) pushAct(n,"chat",a,`${a} ส่งข้อความในเควส ${T(x)}`);
      } });
    P.quests.forEach(x=>{ if(!N.quests.some(z=>z.id===x.id) && N.done>P.done) pushAct(n,"approve",a,`${a} ตรวจผ่านงาน ${T(x)} ของ${nm} (+${x.coins} Coins)`); });
    if(N.owned.length>P.owned.length){ const it=item(N.owned.find(i=>!P.owned.includes(i))); pushAct(n,"shop",nm,it.rare?`${nm} สุ่มกาชาได้ [${it.name}] (${it.tier})`:`${nm} ซื้อไอเทม [${it.name}] (-${it.price} Coins)`); }
    else if(JSON.stringify(N.equip)!==JSON.stringify(P.equip)) pushAct(n,"shop",nm,`${nm} เปลี่ยนชุด/ไอเทมที่สวมใส่`);
    if(N.status!==P.status) pushAct(n,"status",nm,`${nm} เปลี่ยนสถานะเป็น ${STATUS[N.status].e} ${STATUS[N.status].t}`);
  });
  (n.open||[]).forEach(x=>{ if(!(p.open||[]).some(z=>z.id===x.id)) pushAct(n,"open",a,`${a} โพสต์เควสกลาง [${x.title}]`); });
};

function Fb({data,keys}) {
  const mx = Math.max(1,...data.flatMap(d=>keys.map(k=>d[k]||0)));
  return <div className="space-y-1 text-xs">{data.map(d=><div key={d.name}><b>{d.name}</b>{keys.map((k,i)=><div key={k} className="flex items-center gap-1"><div style={{height:8,width:((d[k]||0)/mx*100)+"%",background:COLS[i]}}/>{d[k]||0}</div>)}</div>)}</div>;
}

function AdminDash({data,replace}) {
  const [who,setWho] = useState("all"), [typ,setTyp] = useState("all"), [tick,setTick] = useState(0), [io,setIo] = useState(""), [msg,setMsg] = useState("");
  const I = INTERNS.map(n=>({n,...data.interns[n]}));
  const done = I.reduce((a,r)=>a+r.done,0), active = I.reduce((a,r)=>a+r.quests.length,0), total = done+active;
  const rate = total?Math.round(done/total*100):0;
  const bar = I.map(r=>({name:r.n.replace("น้อง",""),รับงาน:r.done+r.quests.length,เคลียร์:r.done}));
  const cnt = {}; I.forEach(r=>{[...r.quests,...r.log].forEach(x=>{cnt[x.by]=(cnt[x.by]||0)+1;});}); data.open.forEach(x=>{cnt[x.by]=(cnt[x.by]||0)+1;});
  const pie = Object.entries(cnt).map(([name,value])=>({name,value}));
  const hrs = Array.from({length:24},(_,h)=>({name:h+":00",การใช้งาน:0})); data.acts.forEach(a=>{hrs[new Date(a.t).getHours()].การใช้งาน++;});
  const acts = [...data.acts].reverse().filter(a=>(who==="all"||a.who===who)&&(typ==="all"||a.type===typ)).slice(0,80);
  const t0 = performance.now(); let okStore = true;
  try{ localStorage.setItem("iq-probe","1"); localStorage.getItem("iq-probe"); localStorage.removeItem("iq-probe"); }catch(e){ okStore=false; }
  const ms = Math.round((performance.now()-t0)*100)/100;
  let bytes = 0; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&(k.startsWith("intern-quest")||k.startsWith("iq-"))) bytes+=(k.length+localStorage.getItem(k).length)*2; } }catch(e){}
  const kb = bytes/1024, pct = Math.min(100,kb/5120*100);
  const chatKb = JSON.stringify(I.map(r=>r.quests.map(x=>x.chat||[]))).length*2/1024;
  let errs = []; try{ errs = JSON.parse(localStorage.getItem(ERRKEY)||"[]"); }catch(e){}
  const recent = errs.filter(e=>Date.now()-e.t<600000).length;
  const st = (!okStore||pct>90)?["🔴","มีปัญหา"]:(recent>0||pct>70)?["🟡","ควรตรวจสอบ"]:["🟢","ระบบปกติ"];
  const exportJ = () => { const j=JSON.stringify(data,null,1); setIo(j); try{ navigator.clipboard.writeText(j).then(()=>setMsg("📋 คัดลอก JSON แล้ว (หรือคัดลอกจากช่องด้านล่าง)"),()=>setMsg("คัดลอก JSON จากช่องด้านล่างได้เลย")); }catch(e){ setMsg("คัดลอก JSON จากช่องด้านล่างได้เลย"); } };
  const importJ = () => { try{ const d=JSON.parse(io); if(!d||!d.interns) throw new Error("รูปแบบไม่ถูกต้อง"); if(!confirm("กู้คืนจะทับข้อมูลปัจจุบัน ยืนยัน?")) return; replace(d); setMsg("✅ กู้คืนสำเร็จ"); }catch(e){ setMsg("❌ กู้คืนไม่สำเร็จ: "+e.message); logErr("Import: "+e.message); } };
  const clean = () => { if(!confirm("ล้างประวัติเก่า? (ไม่กระทบเหรียญ/คิวงาน)")) return; const d=JSON.parse(JSON.stringify(data)); d.acts=d.acts.slice(-50); INTERNS.forEach(n=>{const m=d.interns[n]; m.log=m.log.slice(0,20); m.quests.forEach(x=>{ if(x.chat) x.chat=x.chat.slice(-30); });}); try{localStorage.removeItem(ERRKEY);}catch(e){} replace(d); setMsg("🧹 ล้างประวัติเก่าแล้ว"); setTick(tick+1); };
  return (<div className="mt-4 space-y-4">
    <div className="plaque text-center">🛠️ หลังบ้านกิลด์</div>
    <div className="grid grid-cols-3 gap-2">{[["👥","เข้าใช้งาน",data.visits],["📜","เควสทั้งหมด",total],["🎯","เคลียร์สำเร็จ",rate+"%"]].map(([i,l,v])=><div key={l} className="px p-3 text-center"><div className="text-2xl">{i}</div><div className="text-2xl font-black">{v}</div><div className="text-xs">{l}</div></div>)}</div>
    <div className="px p-3"><b>📊 ผลงานน้องแต่ละคน</b>
      {RC ? <RC.ResponsiveContainer width="100%" height={220}><RC.BarChart data={bar}><RC.CartesianGrid strokeDasharray="3 3"/><RC.XAxis dataKey="name"/><RC.YAxis allowDecimals={false}/><RC.Tooltip/><RC.Legend/><RC.Bar dataKey="รับงาน" fill="#c99a2e"/><RC.Bar dataKey="เคลียร์" fill="#4f8a3d"/></RC.BarChart></RC.ResponsiveContainer> : <Fb data={bar} keys={["รับงาน","เคลียร์"]}/>}</div>
    <div className="grid md:grid-cols-2 gap-3">
      <div className="px p-3"><b>🥧 พี่ที่สั่งงานบ่อยสุด</b>
        {RC ? <RC.ResponsiveContainer width="100%" height={220}><RC.PieChart><RC.Pie data={pie} dataKey="value" nameKey="name" outerRadius={70} label>{pie.map((e,i)=><RC.Cell key={i} fill={COLS[i%5]}/>)}</RC.Pie><RC.Tooltip/><RC.Legend/></RC.PieChart></RC.ResponsiveContainer> : <Fb data={pie.map(p=>({name:p.name,งาน:p.value}))} keys={["งาน"]}/>}</div>

    <div className="px p-3"><b>📜 ไทม์ไลน์กิจกรรม</b>
      <div className="flex flex-wrap gap-2 my-2">
        <select className="border-2 rounded p-1 text-black" value={who} onChange={e=>setWho(e.target.value)}><option value="all">ทุกคน</option>{[...SENIORS,...INTERNS].map(n=><option key={n}>{n}</option>)}</select>

      </div></div>
    <div className="px p-3"><b>🩺 สถานะระบบ & จัดการข้อมูล</b>
      <div className="text-lg font-black mt-1">{st[0]} {st[1]}</div>
      <div className="text-sm">⏱️ ความหน่วงอ่าน/เขียนข้อมูล (จำลองจากเวลาจริงของเบราว์เซอร์): {ms} ms</div>
      <div className="text-sm">🔌 การเชื่อมต่อข้อมูล: {okStore?"🟢 LocalStorage ใช้งานได้":"🔴 LocalStorage ใช้ไม่ได้"} · {navigator.onLine?"🌐 ออนไลน์":"📴 ออฟไลน์"}</div>
      <div className="text-sm mt-2">💾 พื้นที่ความจำ: {kb.toFixed(1)} KB / ~5,120 KB ({pct.toFixed(1)}%) · แชทในคิวปัจจุบัน ~{chatKb.toFixed(1)} KB</div>
      <div className="border-2 border-[var(--line)]" style={{height:16,background:"#8a6034"}}><div style={{height:"100%",width:Math.max(1,pct)+"%",background:pct>90?"#b3261e":pct>70?"#e8a22c":"#4f8a3d"}}/></div>

      <div className="relative portrait">{i===0&&<div className="absolute text-xl" style={{top:-18,left:"50%",transform:"translateX(-50%)"}}>👑</div>}<Avatar equip={r.equip} uid={"h"+i} size={56} who={r.n}/></div>

    </div>
  );

function App() {

  const [user,setUser] = useState(()=>{ try{const u=JSON.parse(localStorage.getItem(KEY+"-user")); return u&&u.role==="intern"?u:null;}catch(e){return null;} });
  const [pass,setPass] = useState(false);
  const [force,setForce] = useState(null);
  const [hall,setHall] = useState(false), [goto,setGoto] = useState(null), [act,setAct] = useState(null);
  CUR = user;
  const save = (k,v) => { try{localStorage.setItem(k,JSON.stringify(v));}catch(e){logErr("บันทึกข้อมูลไม่สำเร็จ: "+e.message);} };
  useEffect(()=>save(KEY,data),[data]);
  useEffect(()=>{ window.__LOG=(t,w,x)=>update(s=>{pushAct(s,t,w,x);}); update(s=>{s.visits=(s.visits||0)+1;}); },[]);
  const update = fn => setData(prev=>{const n=JSON.parse(JSON.stringify(prev)); fn(n); if(n.roster) INTERNS.splice(0,INTERNS.length,...n.roster); try{diffActs(prev,n);}catch(e){logErr("diffActs: "+e.message);} return n;});
  const login = u => { CUR=u; update(s=>{pushAct(s,"login",u.name,`${u.name} ล็อกอินเข้าสู่ระบบ`);}); setForce(null); setUser(u); save(KEY+"-user",u); };
  const logout = () => { setHall(false); setGoto(null); setAct(null); setUser(null); try{localStorage.removeItem(KEY+"-user");}catch(e){} };
  return (
    <div>
      {pass && <PassModal onOk={()=>{setPass(false);logout();setForce("senior");}} onClose={()=>setPass(false)}/>}
      <SoundBtn/>
      <div className="text-center pt-4 px-3"><div className="banner"><span className="text-3xl">⚔️</span> <span className="ptitle">INTERN QUEST</span> <span className="text-3xl">🛡️</span><div className="guild">กิลด์เควสเด็กฝึกงาน · Guild</div></div></div>
      {user && (
        <div className="px mx-4 mt-3 p-3 flex justify-between items-center">
          <b>{user.role==="senior"?"🧙‍♂️":"🧑‍🎓"} {user.name}</b>
          <div className="flex gap-2"><button className="btn bg-amber-300 text-black text-sm" onClick={()=>{setHall(!hall);setGoto(null);setAct(null);}}>{hall?"📋 กลับบอร์ดงาน":"🏰 ลงเดินในกิลด์ (Guild Hall)"}</button>{user.role==="intern" && <button className="btn bg-purple-400 text-black text-sm" onClick={()=>setPass(true)}>🔐 สลับไปฝั่งพี่</button>}<button className="btn bg-white text-black text-sm" onClick={logout}>🔄 สลับตัวละคร (Logout)</button></div>
        </div>)}
      {user&&data.boss&&<BossBar boss={data.boss}/>}
      {!user||(user.role==="intern"&&!data.interns[user.name]) ? <Login onLogin={login} initRole={force}/> : user.role==="senior" ? (hall ? <GuildHall me={user.name} role="senior" data={data} update={update} onGo={(t,a)=>{setHall(false);setGoto(t||null);setAct(a||null);}}/> : <SeniorView key={goto+"|"+(act?act.t+act.n:"")} initTab={goto} initAction={act} me={user.name} data={data} update={update} replace={d=>setData(norm(d))}/>) : (hall ? <GuildHall me={user.name} role="intern" data={data} update={update} onGo={(t,a)=>{setHall(false);setGoto(t||null);setAct(a||null);}}/> : <InternView key={goto} initTab={goto} me={user.name} data={data} update={update}/>)}
      <div className="text-center text-xs opacity-50 my-6">ข้อมูลเก็บใน LocalStorage ของเบราว์เซอร์นี้ · <button className="underline" onClick={()=>{if(confirm("รีเซ็ตข้อมูลทั้งหมด?")){setData(norm(seed()));}}}>รีเซ็ตข้อมูลตัวอย่าง</button></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
